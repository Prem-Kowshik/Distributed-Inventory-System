# ---------------------------------------------------------------------------
# Multi-Warehouse Distributed Inventory - cluster layout
#   router <host> <port>
#   node   <WAREHOUSE> <nodeId> <host> <port>
# Each warehouse (shard / data fragment) is replicated on 3 nodes.
# To run across several laptops, replace 127.0.0.1 with each machine's LAN IP.
# ---------------------------------------------------------------------------
router 127.0.0.1 7070

node MUMBAI m1 127.0.0.1 7101
node MUMBAI m2 127.0.0.1 7102
node MUMBAI m3 127.0.0.1 7103

node PUNE   p1 127.0.0.1 7201
node PUNE   p2 127.0.0.1 7202
node PUNE   p3 127.0.0.1 7203

node DELHI  d1 127.0.0.1 7301
node DELHI  d2 127.0.0.1 7302
node DELHI  d3 127.0.0.1 7303

# sync   = wait for all in-sync replicas (ISR) before acking a write
# quorum = refuse writes unless a majority of replicas is reachable (CP)
# async  = ack immediately, ship in background (fast, may lose recent writes on failover)
replication.mode=sync

# failure detector: ping every heartbeat.ms, node is DOWN after failure.threshold misses
heartbeat.ms=500
failure.threshold=3

# read load balancing: rr | leastconn | random | primary
lb.policy=rr

# take a snapshot and truncate the WAL every N log records
checkpoint.every=50
fsync=true
